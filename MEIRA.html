// Self-contained QR-style code renderer (no external dependency, always renders).
function drawPseudoQR(container, text, sizePx){
  const N = 25;
  function hash(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  let seed = hash(text);
  function rnd(){ seed = (seed * 1103515245 + 12345) >>> 0; return (seed >>> 8) / 16777216; }
  const grid = Array.from({length:N}, () => Array(N).fill(0));
  function isFinderZone(r,c){
    const zones = [[0,0],[0,N-7],[N-7,0]];
    return zones.some(([zr,zc]) => r>=zr && r<zr+7 && c>=zc && c<zc+7);
  }
  function drawFinder(r0,c0){
    for (let r=0;r<7;r++) for (let c=0;c<7;c++){
      const onBorder = r===0||r===6||c===0||c===6;
      const inCore = r>=2&&r<=4&&c>=2&&c<=4;
      grid[r0+r][c0+c] = (onBorder || inCore) ? 1 : 0;
    }
  }
  drawFinder(0,0); drawFinder(0,N-7); drawFinder(N-7,0);
  for (let i=8;i<N-8;i++){ grid[6][i] = i%2===0?1:0; grid[i][6] = i%2===0?1:0; }
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    if (isFinderZone(r,c)) continue;
    if (r===6||c===6) continue;
    grid[r][c] = rnd() > 0.55 ? 1 : 0;
  }
  const scale = Math.floor(sizePx / N);
  const px = scale * N;
  const svgRows = [];
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    if (grid[r][c]) svgRows.push(`<rect x="${c*scale}" y="${r*scale}" width="${scale}" height="${scale}" fill="#141414"/>`);
  }
  container.innerHTML = `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}" style="display:block;">
    <rect width="${px}" height="${px}" fill="#ffffff"/>${svgRows.join('')}
  </svg>`;
}

// ---------- OCR FUZZY SERIAL MATCHING ----------
function levenshtein(a, b){
  a = (a||'').toUpperCase().trim(); b = (b||'').toUpperCase().trim();
  const m = a.length, n = b.length;
  const dp = [];
  for (let i=0;i<=m;i++){ dp.push(new Array(n+1).fill(0)); dp[i][0] = i; }
  for (let j=0;j<=n;j++) dp[0][j] = j;
  for (let i=1;i<=m;i++){
    for (let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i-1][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
}
function matchSerial(registered, captured){
  const reg = (registered||'').toUpperCase().trim();
  const cap = (captured||'').toUpperCase().trim();
  if (!reg || !cap) return { status:'PENDING', distance:null };
  if (reg === cap) return { status:'MATCH', distance:0 };
  const distance = levenshtein(reg, cap);
  if (distance <= 1) return { status:'REVIEW', distance };
  return { status:'MISMATCH', distance };
}
function introduceOcrNoise(str, charsToAlter){
  if (!str) return str;
  const confusions = {'0':'O','O':'0','1':'I','I':'1','8':'B','B':'8','5':'S','S':'5','2':'Z','Z':'2'};
  const chars = str.split('');
  const idxs = new Set();
  const n = Math.min(charsToAlter, chars.length);
  while (idxs.size < n) idxs.add(Math.floor(Math.random()*chars.length));
  idxs.forEach(i => { const c = chars[i]; chars[i] = confusions[c] || String.fromCharCode(65+Math.floor(Math.random()*26)); });
  return chars.join('');
}

// ---------- COMPUTE RISK WITH INDIVIDUAL MULTIPLIERS ----------
function calculateParametricRisk(req){
  const rp = req.riskParams || {};
  const wBase = (rp.workload && typeof rp.workload.base === 'number') ? rp.workload.base : 12;
  const wMult = (rp.workload && typeof rp.workload.mult === 'number') ? rp.workload.mult : 1.20;

  const eBase = (rp.expertise && typeof rp.expertise.base === 'number') ? rp.expertise.base : 15;
  const eMult = (rp.expertise && typeof rp.expertise.mult === 'number') ? rp.expertise.mult : 1.25;

  const lBase = (rp.location && typeof rp.location.base === 'number') ? rp.location.base : 15;
  const lMult = (rp.location && typeof rp.location.mult === 'number') ? rp.location.mult : 1.20;

  const dBase = (rp.duration && typeof rp.duration.base === 'number') ? rp.duration.base : 12;
  const dMult = (rp.duration && typeof rp.duration.mult === 'number') ? rp.duration.mult : 1.25;

  const wSub = Math.round(wBase * wMult);
  const eSub = Math.round(eBase * eMult);
  const lSub = Math.round(lBase * lMult);
  const dSub = Math.round(dBase * dMult);

  const totalScore = Math.min(100, Math.round(wSub + eSub + lSub + dSub));

  let level = 'LOW';
  if (totalScore >= 65) level = 'CRITICAL';
  else if (totalScore >= 45) level = 'HIGH';
  else if (totalScore >= 25) level = 'MEDIUM';

  return {
    wBase, wMult, wSub,
    eBase, eMult, eSub,
    lBase, lMult, lSub,
    dBase, dMult, dSub,
    totalScore,
    level,
    breakdownString: `W:${wBase}×${wMult}=${wSub} | E:${eBase}×${eMult}=${eSub} | L:${lBase}×${lMult}=${lSub} | D:${dBase}×${dMult}=${dSub}`
  };
}

// Storage adapter
async function loadState(){
  try {
    if (window.storage && window.storage.get) {
      const r = await window.storage.get('meira-shared-state', true);
      if (r && r.value) {
        const s = JSON.parse(r.value);
        if (!s.anomalyReviews) s.anomalyReviews = {};
        if (!s.requests || s.requests.length === 0) return createInitialSeedData();
        return s;
      }
    }
  } catch(e) {}
  try {
    const loc = localStorage.getItem('meira-shared-state');
    if (loc) {
      const s = JSON.parse(loc);
      if (!s.anomalyReviews) s.anomalyReviews = {};
      if (!s.requests || s.requests.length === 0) return createInitialSeedData();
      return s;
    }
  } catch(e) {}
  return createInitialSeedData();
}

function computeStatus(cert){
  if (!cert) return null;
  if (cert.revoked) return 'REVOKED';
  if (new Date(cert.validUntil) < new Date()) return 'EXPIRED';
  return 'VALID';
}

// Anomaly detection helpers
function computeOfficerDailyCounts(){
  const byOfficer = {};
  Object.values(state.certificates).forEach(c => {
    const officer = `${c.verifiedRole} ${c.verifiedId}`;
    const day = dayKey(c.verifiedDate);
    byOfficer[officer] = byOfficer[officer] || {};
    byOfficer[officer][day] = (byOfficer[officer][day]||0) + 1;
  });
  return byOfficer;
}
function computeAnomalies(){
  const byOfficer = computeOfficerDailyCounts();
  const BASELINE = 20;
  const anomalies = [];
  Object.entries(byOfficer).forEach(([officer, days]) => {
    const sortedDays = Object.keys(days).sort();
    sortedDays.forEach((day, idx) => {
      const priorDays = sortedDays.slice(Math.max(0, idx-30), idx);
      const priorCounts = priorDays.map(d => days[d]);
      const count = days[day];
      let avg = null, flagged = false, reason = '';
      if (priorCounts.length >= 3) {
        avg = priorCounts.reduce((a,b)=>a+b,0) / priorCounts.length;
        if (count > Math.max(avg*2.5, avg+8)) {
          flagged = true;
          reason = `${count} inspections vs officer trailing average of ${avg.toFixed(1)}/day`;
        }
      } else if (count > BASELINE) {
        flagged = true;
        reason = `${count} inspections in one day exceeds baseline of ${BASELINE}/day`;
      }
      if (flagged) anomalies.push({ officer, day, count, avg, reason, key:`${officer}__${day}` });
    });
  });
  return anomalies.sort((a,b)=> b.day.localeCompare(a.day));
}
function simulateOfficerActivity(){
  const officers = ACCOUNTS.filter(a => a.role==='LMO' || a.role==='GATC');
  const td = new Date();
  officers.forEach((officer, oi) => {
    for (let d = 34; d >= 0; d--){
      if (Math.random() < 0.3) continue;
      let count = 8 + Math.floor(Math.random()*10);
      if (oi === 0 && d === 4) count = 45;
      const date = addDays(td, -d);
      for (let k=0;k<count;k++){
        const certId = `SIM-${officer.id}-${d}-${k}`;
        const ts = new Date(date); ts.setHours(9 + Math.floor(Math.random()*8), Math.floor(Math.random()*60));
        state.certificates[certId] = {
          id: certId, synthetic: true,
          type: 'Electronic Platform Scale', category: 'weighing',
          details: { manufacturer:'Demo Tech', model:'DT-100', serial:'SIM'+Math.floor(Math.random()*99999) },
          ownerId: 'SIM-OWNER', ownerName: 'Simulated Business', area: 'Kalupur',
          verifiedRole: officer.role, verifiedId: officer.id,
          verifiedDate: ts.toISOString(), validUntil: addDays(ts,365).toISOString(),
          gps: '23.0225° N, 72.5714° E', evidenceHash: 'SIMDATA7788', revoked: false
        };
      }
    }
  });
}
function clearSimulatedActivity(){
  Object.keys(state.certificates).forEach(id => { if (id.startsWith('SIM-')) delete state.certificates[id]; });
}

function badgeForStatus(s){
  const map = { pending:'grey', assigned:'warn', in_progress:'warn', completed:'valid', rejected:'crit' };
  const labelMap = { pending:'PENDING', assigned:'ASSIGNED', in_progress:'IN PROGRESS', completed:'COMPLETED', rejected:'REJECTED' };
  return `<span class="badge ${map[s]||'grey'}">${labelMap[s]||s.toUpperCase()}</span>`;
}
function badgeForCert(s){
  const map = { VALID:'valid', EXPIRED:'warn', REVOKED:'crit' };
  return `<span class="badge ${map[s]||'grey'}">${s}</span>`;
}
function badgeForRisk(level){
  const map = { LOW:'grey', MEDIUM:'warn', HIGH:'warn', CRITICAL:'crit' };
  return `<span class="badge ${map[level]||'grey'}">${level}</span>`;
}

function wireRequestForm(root, onSubmitted){
  const catSel = root.querySelector('#f_category');
  const typeSel = root.querySelector('#f_type');
  const dyn = root.querySelector('#f_dynamicFields');
  const contactInp = root.querySelector('#f_contact');
  const areaInp = root.querySelector('#f_area');

  contactInp.addEventListener('input', () => {
    contactInp.value = contactInp.value.replace(/\D/g, '').slice(0, 10);
  });

  root.querySelectorAll('[data-chip]').forEach(chip => {
    chip.addEventListener('click', () => {
      areaInp.value = chip.getAttribute('data-chip');
    });
  });

  function fillTypes(){
    const cat = catSel.value;
    typeSel.innerHTML = Object.keys(INSTRUMENT_TYPES[cat].types).map(t=>`<option value="${t}">${t}</option>`).join('');
    fillDynamic();
  }
  function fillDynamic(){
    const cat = catSel.value, type = typeSel.value;
    const fields = INSTRUMENT_TYPES[cat].types[type] || [];
    dyn.innerHTML = fields.map(f => {
      const placeholder = f==='capacity' ? 'e.g. 50 kg' : f==='serial' ? 'e.g. AHD-2026-WM01' : f==='manufacturer' ? 'e.g. Eagle Scale Co.' : getFieldLabel(f);
      return `<div class="field">
        <label>${getFieldLabel(f)} *</label>
        <input data-f="${f}" id="f_dyn_${f}" placeholder="${placeholder}"/>
        <div class="field-error" id="err_dyn_${f}" style="display:none;"></div>
      </div>`;
    }).join('');
  }
  catSel.addEventListener('change', fillTypes);
  typeSel.addEventListener('change', fillDynamic);
  fillTypes();

  // Dynamic risk calculation preview
  function updateRiskCalcPreview(){
    const wB = parseFloat(root.querySelector('#p_workload_base').value) || 12;
    const wM = parseFloat(root.querySelector('#p_workload_mult').value) || 1.20;

    const eB = parseFloat(root.querySelector('#p_expertise_base').value) || 12;
    const eM = parseFloat(root.querySelector('#p_expertise_mult').value) || 1.25;

    const lB = parseFloat(root.querySelector('#p_location_base').value) || 12;
    const lM = parseFloat(root.querySelector('#p_location_mult').value) || 1.20;

    const dB = parseFloat(root.querySelector('#p_duration_base').value) || 12;
    const dM = parseFloat(root.querySelector('#p_duration_mult').value) || 1.25;

    const wSub = Math.round(wB * wM);
    const eSub = Math.round(eB * eM);
    const lSub = Math.round(lB * lM);
    const dSub = Math.round(dB * dM);

    const total = Math.min(100, Math.round(wSub + eSub + lSub + dSub));

    root.querySelector('#w_sub_badge').innerText = `${wSub} pts`;
    root.querySelector('#e_sub_badge').innerText = `${eSub} pts`;
    root.querySelector('#l_sub_badge').innerText = `${lSub} pts`;
    root.querySelector('#d_sub_badge').innerText = `${dSub} pts`;

    let level = 'LOW';
    let badgeClass = 'valid';
    if (total >= 65) { level = 'CRITICAL'; badgeClass = 'crit'; }
    else if (total >= 45) { level = 'HIGH'; badgeClass = 'warn'; }
    else if (total >= 25) { level = 'MEDIUM'; badgeClass = 'warn'; }

    root.querySelector('#riskFormulaPreview').innerHTML = `
      (${wB} × ${wM.toFixed(2)}) + (${eB} × ${eM.toFixed(2)}) + (${lB} × ${lM.toFixed(2)}) + (${dB} × ${dM.toFixed(2)}) = ${wSub} + ${eSub} + ${lSub} + ${dSub} = <strong>${total} / 100 Points</strong>
    `;
    root.querySelector('#riskTotalBadge').innerHTML = `
      <span class="badge ${badgeClass}" style="font-size:12px;padding:4px 10px;">${total} / 100 · ${level}</span>
    `;

    return {
      workload: { base: wB, mult: wM, sub: wSub },
      expertise: { base: eB, mult: eM, sub: eSub },
      location: { base: lB, mult: lM, sub: lSub },
      duration: { base: dB, mult: dM, sub: dSub },
      totalScore: total,
      level
    };
  }

  ['#p_workload_base','#p_workload_mult','#p_expertise_base','#p_expertise_mult','#p_location_base','#p_location_mult','#p_duration_base','#p_duration_mult'].forEach(id => {
    root.querySelector(id)?.addEventListener('change', updateRiskCalcPreview);
  });
  updateRiskCalcPreview();

  root.querySelector('#f_submit').addEventListener('click', async () => {
    let hasError = false;
    function setFieldErr(id, msg){
      const errEl = root.querySelector('#' + id);
      const inp = root.querySelector('#' + id.replace('err_', ''));
      if (errEl) {
        if (msg) {
          errEl.innerText = msg; errEl.style.display = 'block';
          if (inp) inp.classList.add('is-invalid');
          hasError = true;
        } else {
          errEl.style.display = 'none';
          if (inp) inp.classList.remove('is-invalid');
        }
      }
    }

    const owner = root.querySelector('#f_owner').value.trim();
    const contact = contactInp.value.trim();
    const area = areaInp.value.trim();
    const address = root.querySelector('#f_address').value.trim();
    const category = catSel.value;
    const type = typeSel.value;

    if (!owner || owner.length < 3) setFieldErr('err_owner', t('err_biz_name'));
    else setFieldErr('err_owner', null);

    if (!contact || !/^\d{10}$/.test(contact)) setFieldErr('err_contact', t('err_contact'));
    else setFieldErr('err_contact', null);

    if (!area || area.length < 2) setFieldErr('err_area', t('err_area'));
    else setFieldErr('err_area', null);

    if (!address || address.length < 5) setFieldErr('err_address', t('err_address'));
    else setFieldErr('err_address', null);

    const details = {};
    dyn.querySelectorAll('[data-f]').forEach(inp => {
      const f = inp.getAttribute('data-f');
      const val = inp.value.trim();
      details[f] = val;
      const errId = `err_dyn_${f}`;

      if (f === 'manufacturer') {
        if (!val || val.length < 2) setFieldErr(errId, t('err_mfg'));
        else setFieldErr(errId, null);
      } else if (f === 'model') {
        if (!val || val.length < 2) setFieldErr(errId, t('err_model'));
        else setFieldErr(errId, null);
      } else if (f === 'serial') {
        if (!val || val.length < 3 || !/^[A-Za-z0-9\-_/]+$/.test(val)) setFieldErr(errId, t('err_serial'));
        else setFieldErr(errId, null);
      } else if (f === 'capacity') {
        const numPart = parseFloat(val);
        if (!val || isNaN(numPart) || numPart <= 0) setFieldErr(errId, t('err_capacity'));
        else setFieldErr(errId, null);
      } else if (f === 'flowRate') {
        if (!val || val.length < 2) setFieldErr(errId, t('err_flow_rate'));
        else setFieldErr(errId, null);
      } else if (f === 'platformSize') {
        if (!val || val.length < 2) setFieldErr(errId, t('err_platform_size'));
        else setFieldErr(errId, null);
      } else {
        if (!val) setFieldErr(errId, `${getFieldLabel(f)} is required.`);
        else setFieldErr(errId, null);
      }
    });

    if (hasError) {
      root.querySelector('#f_err').innerHTML = `<div class="msg err">${t('err_generic_fix')}</div>`;
      return;
    }

    const calculatedRisk = updateRiskCalcPreview();

    const req = {
      id: uid('REQ'),
      createdAt: nowISO(),
      ownerId: session.role==='OWNER' ? session.id : uid('OWN'),
      ownerName: owner, contact, area, address,
      category, type, details,
      status: 'pending',
      assignedRole: null, assignedId: null,
      certificateId: null,
      riskParams: calculatedRisk,
      history: []
    };
    logHistory(req, `Request submitted by ${owner} in ${area} (Risk: ${calculatedRisk.totalScore} pts)`);
    state.requests.unshift(req);
    await saveState();
    onSubmitted(req);
  });
}

function wireCertQrButtons(container){
  container.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-viewqr]');
    if (!btn) return;
    const id = btn.getAttribute('data-viewqr');
    const slot = container.querySelector(`#qrslot-${CSS.escape(id)}`);
    if (!slot) return;
    if (slot.dataset.filled === '1') { slot.innerHTML = ''; slot.dataset.filled = '0'; return; }
    const box = document.createElement('div');
    box.className = 'qr-box';
    slot.innerHTML = ''; slot.appendChild(box);
    drawPseudoQR(box, `MEIRA-CERT:${id}`, 130);
    slot.dataset.filled = '1';
  });
}

function renderTransferPanel(body, certId, onDone){
  const panel = el(`<div class="card" style="margin-top:12px;border-left:3px solid var(--moss);">
    <div style="font-size:12px;font-weight:bold;margin-bottom:8px;">Transfer Instrument to New Owner / Migrate Location</div>
    <div class="row">
      <div class="field"><label>New Owner Name</label><input id="t_owner" placeholder="e.g. Shreenathji Traders"/></div>
      <div class="field"><label>New Area / Location</label><input id="t_area" placeholder="e.g. Maninagar, Ahmedabad"/></div>
    </div>
    <button class="btn moss" id="t_submit">Confirm Migration</button>
  </div>`);
  body.appendChild(panel);
  panel.querySelector('#t_submit').addEventListener('click', async () => {
    const newOwner = panel.querySelector('#t_owner').value.trim();
    const newArea = panel.querySelector('#t_area').value.trim();
    if (!newOwner || !newArea) return;
    const c = state.certificates[certId];
    const oldOwner = c.ownerName, oldArea = c.area;
    c.ownerName = newOwner; c.area = newArea;
    c.migrationLog = c.migrationLog || [];
    c.migrationLog.push({ ts: nowISO(), from: `${oldOwner} · ${oldArea}`, to: `${newOwner} · ${newArea}` });
    await saveState();
    onDone();
  });
}

    `;

    body.querySelector('#fltAll')?.addEventListener('click', () => { ctx.incomingFilter='all'; renderAdmin(root); });
    body.querySelector('#fltHigh')?.addEventListener('click', () => { ctx.incomingFilter='high'; renderAdmin(root); });

    body.querySelectorAll('[data-assign]').forEach(b => b.addEventListener('click', () => { 
      ctx.riskReq=null; 
      ctx.assignReq = b.getAttribute('data-assign'); 
      renderAdmin(root); 
    }));
    body.querySelectorAll('[data-risk]').forEach(b => b.addEventListener('click', () => { 
      ctx.assignReq=null; 
      ctx.riskReq = (ctx.riskReq === b.getAttribute('data-risk')) ? null : b.getAttribute('data-risk'); 
      renderAdmin(root); 
    }));

    if (ctx.assignReq) renderAssignPanel(body.querySelector('#assignPanel')||body, ctx.assignReq, () => { ctx.assignReq=null; renderAdmin(root); });
    if (ctx.riskReq) {
      const target = scoredList.find(x => x.r.id === ctx.riskReq);
      if (target) renderParametricRiskPanel(body.querySelector('#riskPanel')||body, target.r, target.risk);
    }
  }
  else if (ctx.tab === 'certs') {
    body.innerHTML = certs.length ? `
      <table><thead><tr><th>Certificate ID</th><th>${t('th_inst')}</th><th>${t('th_owner')}</th><th>Risk Audit</th><th>${t('th_status')}</th><th>Valid Until</th><th>Actions</th></tr></thead>

        <td>${c.riskAudit?.status==='VERIFIED_LEGIT' ? '<span class="badge valid">✓ Legit</span>' : c.riskAudit?.status==='MISDECLARED_FINED' ? '<span class="badge crit">Fined ₹5,000</span>' : '—'}</td>
        <td>${badgeForCert(computeStatus(c))}</td><td>${fmtDate(c.validUntil)}</td>

      <div id="adminQrSlot" style="margin-top:14px;"></div>
    ` : `<div style="color:var(--ink-soft);">No certificates issued yet.</div>`;
    wireCertQrButtons(body);
  }
  else if (ctx.tab === 'anomaly') {
    body.innerHTML = anomalyTabHTML();
    const simBtn = body.querySelector('#simulateActivity');
    if (simBtn) simBtn.addEventListener('click', async () => { simulateOfficerActivity(); await saveState(); renderAdmin(root); });
    const clearBtn = body.querySelector('#clearSimData');
    if (clearBtn) clearBtn.addEventListener('click', async () => { clearSimulatedActivity(); await saveState(); renderAdmin(root); });
    body.querySelectorAll('[data-review]').forEach(b => b.addEventListener('click', async () => {
      state.anomalyReviews[b.getAttribute('data-review')] = { ts: nowISO(), by: session.id };
      await saveState();
      renderAdmin(root);
    }));
  }
  else if (ctx.tab === 'audit') {
    body.innerHTML = state.requests.length ? state.requests.map(r => historyBlockHTML(r)).join('<div class="divider"></div>') : `<div style="color:var(--ink-soft);">No activity yet.</div>`;
  }
}

  const panel = el(`<div class="card" style="margin-top:14px;border-left:4px solid ${levelColor};background:#FCFDFD;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-weight:bold;font-size:13.5px;color:var(--ink);">Request Menu Parametric Risk Evaluation — ${req.id}</div>
        <div style="font-size:11px;color:var(--ink-soft);">Applicant: <strong>${req.ownerName}</strong> | Region: <strong>${req.area}</strong></div>
      </div>
      <div style="text-align:right;">
        ${badgeForRisk(risk.level)}
        <div style="font-weight:bold;font-size:16px;color:${levelColor};margin-top:2px;">${risk.totalScore} / 100 Points</div>
      </div>
    </div>
    <div class="divider"></div>

    <div style="background:#F1F4F7;border:1px solid #D5DCE2;padding:10px;border-radius:4px;margin-bottom:12px;font-size:11.5px;">
      <div style="font-weight:bold;color:var(--ink);margin-bottom:4px;">Formula Applied (Individual Multipliers):</div>
      <code>Actual Risk = min(100, round((W × Mw) + (E × Me) + (L × Ml) + (D × Md)))</code><br/>
      <code>= min(100, round((${risk.wBase} × ${risk.wMult.toFixed(2)}) + (${risk.eBase} × ${risk.eMult.toFixed(2)}) + (${risk.lBase} × ${risk.lMult.toFixed(2)}) + (${risk.dBase} × ${risk.dMult.toFixed(2)})))</code><br/>
      <code>= min(100, round(${risk.wSub} + ${risk.eSub} + ${risk.lSub} + ${risk.dSub})) = <strong>${risk.totalScore} / 100</strong></code>
    </div>

    <div style="font-size:11.5px;margin-bottom:6px;font-weight:bold;">Declared Parameters &amp; Multipliers:</div>
    <table style="background:#fff;margin-bottom:12px;">
      <thead><tr><th>Parameter</th><th>Declared Base Rating (0-25)</th><th>Individual Multiplier</th><th>Subtotal Points</th></tr></thead>
      <tbody>
        <tr>
          <td><strong>1. ${t('param_workload')} (W)</strong></td>
          <td>${risk.wBase} pts</td>
          <td><strong style="color:var(--ink);">${risk.wMult.toFixed(2)}x</strong></td>
          <td style="font-weight:bold;color:var(--ink);">${risk.wSub} pts</td>
        </tr>
        <tr>
          <td><strong>2. ${t('param_expertise')} (E)</strong></td>
          <td>${risk.eBase} pts</td>
          <td><strong style="color:var(--ink);">${risk.eMult.toFixed(2)}x</strong></td>
          <td style="font-weight:bold;color:var(--ink);">${risk.eSub} pts</td>
        </tr>
        <tr>
          <td><strong>3. ${t('param_location')} (L)</strong></td>
          <td>${risk.lBase} pts</td>
          <td><strong style="color:var(--ink);">${risk.lMult.toFixed(2)}x</strong></td>
          <td style="font-weight:bold;color:var(--ink);">${risk.lSub} pts</td>
        </tr>
        <tr>
          <td><strong>4. ${t('param_duration')} (D)</strong></td>
          <td>${risk.dBase} pts</td>
          <td><strong style="color:var(--ink);">${risk.dMult.toFixed(2)}x</strong></td>

function renderAssignPanel(container, reqId, onDone){
  const req = state.requests.find(r=>r.id===reqId);
  const lmos = ACCOUNTS.filter(a=>a.role==='LMO');
  const gatcs = ACCOUNTS.filter(a=>a.role==='GATC');
  const panel = el(`<div class="card" style="margin-top:14px;border-left:4px solid var(--ink);">
    <div style="font-weight:bold;font-size:12.5px;margin-bottom:8px;">Assign ${req.id} — ${req.type} (${req.ownerName}, ${req.area})</div>
    <div class="row">
      <div class="field">
        <label>Verification Channel</label>
        <select id="a_route"><option value="LMO">LMO — Field Verification (On-Site)</option><option value="GATC">GATC — Government Testing Centre (Specialized Lab)</option></select>
      </div>
      <div class="field"><label>Select Officer / Centre</label><select id="a_who"></select></div>
    </div>
    <button class="btn" id="a_submit">Confirm Assignment</button>
  </div>`);
  container.innerHTML = '';
  container.appendChild(panel);
  const routeSel = panel.querySelector('#a_route');
  const whoSel = panel.querySelector('#a_who');
  function fillWho(){ 
    const list = routeSel.value==='LMO'?lmos:gatcs; 
    whoSel.innerHTML = list.map(a=>`<option value="${a.id}">${a.label}</option>`).join(''); 
  }
  routeSel.addEventListener('change', fillWho); 
  fillWho();
  panel.querySelector('#a_submit').addEventListener('click', async () => {
    req.status = 'assigned'; req.assignedRole = routeSel.value; req.assignedId = whoSel.value;
    logHistory(req, `Admin assigned to ${routeSel.value} ${whoSel.value}`);
    await saveState();
    onDone();
  });
}

  }));
  const body = root.querySelector('#fieldBody');
  const mine = state.requests.filter(r => r.assignedId === session.id);

        </tr>`;
      }).join('')}</tbody></table>
    ` : `<div style="color:var(--ink-soft);padding:14px 0;">No active assignments. Requests assigned by Legal Metrology Admin appear here.</div>`;
    body.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { ctx.openReq = b.getAttribute('data-open'); renderField(root, roleKey); }));
  }
  else if (ctx.tab === 'history') {
    const done = mine.filter(r => r.status==='completed' || r.status==='rejected');
    body.innerHTML = done.length ? done.map(r => {
      const c = state.certificates[r.certificateId];

    wireCertQrButtons(body);

          <!-- Tick Mark for verifying that risk score is legit -->
          <div id="riskLegitBox" style="margin-bottom:8px;">
            <label style="display:flex;align-items:flex-start;gap:8px;text-transform:none;font-size:12px;cursor:pointer;font-weight:600;color:var(--ink);">
              <input type="checkbox" id="chkRiskLegit" style="width:auto;margin-top:2px;cursor:pointer;"/>
              <span>${t('risk_audit_chk').replace('{score}', risk.totalScore)}</span>
            </label>
          </div>

          <div style="font-size:10.5px;color:#555;background:#F1F3F0;padding:6px 10px;border-radius:3px;margin-bottom:10px;border-left:3px solid var(--ochre);">
            ⚖️ <strong>${t('risk_audit_statutory_note')}</strong>
          </div>

          <!-- Section to flag illegitimate / false risk score with fine -->
          <div id="riskFineActionArea">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <button type="button" class="btn ghost" id="btnToggleRiskFine" style="border:1px solid var(--brick);color:var(--brick);font-size:11px;padding:5px 12px;">
                ${t('risk_audit_flag_btn')}
              </button>
              <span style="font-size:10.5px;color:var(--ink-soft);">Use if applicant under-reported parameters to evade high-risk scrutiny.</span>
            </div>

            <div id="fineFormArea" style="display:none;margin-top:10px;background:#FFF5F5;border:1px solid var(--brick);padding:12px;border-radius:4px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <span style="font-weight:bold;color:var(--brick);font-size:12px;">🚨 STATUTORY FINE NOTICE ISSUANCE (SECTION 53)</span>
                <span class="stamp" style="color:var(--brick);font-size:12px;font-weight:bold;">MANDATORY FINE: ₹5,000</span>
              </div>
              <div style="font-size:11px;color:#444;margin-bottom:8px;">
                The customer declared an operational score of <strong>${risk.totalScore} pts</strong>, but physical on-site verification revealed falsified or misdeclared operational parameters.
              </div>
              <div class="field" style="margin-bottom:8px;">
                <label style="font-size:10px;color:var(--brick);">Specific Inspection Findings / Discrepancy Reason *</label>
                <input id="fineFindingReason" placeholder="e.g. Customer declared light retail workload, but unit operates in continuous 24/7 heavy industrial loading" value="Applicant under-declared operational workload and complexity to evade high-risk verification protocols"/>
              </div>
              <div style="display:flex;gap:8px;align-items:center;">
                <button type="button" class="btn brick" id="btnConfirmRiskFine" style="font-size:11px;padding:6px 14px;">Confirm & Impose ₹5,000 Fine on Applicant</button>
                <button type="button" class="btn ghost" id="btnCancelRiskFine" style="font-size:11px;padding:6px 12px;">Cancel</button>
              </div>
            </div>

            <div id="activeFineStatus" style="display:none;margin-top:10px;" class="msg err"></div>
          </div>
        </div>

        <div class="divider"></div>
        <div id="verifyErrSlot"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
          <button class="btn moss" id="submitVerify" style="padding:9px 18px;">${t('btn_submit_cert')}</button>
          <button class="btn brick" id="rejectVerify" style="padding:9px 18px;">${t('btn_reject_app')}</button>
        </div>
      </div>
    </div>
    <div id="rejectionModalHost"></div>
  `;

  body.querySelector('#back').addEventListener('click', onDone);

  // GPS Capture step
  body.querySelector('#captureGps').addEventListener('click', () => {
    const gps = `${(22.9 + Math.random()*0.15).toFixed(5)}° N, ${(72.5 + Math.random()*0.15).toFixed(5)}° E`;
    ctx.gps = gps; ctx.ts = nowISO();
    body.querySelector('#gpsResult').innerHTML = `<div class="msg ok">✓ GPS Captured: ${gps} · Timestamp: ${new Date(ctx.ts).toLocaleString()} · Officer: ${session.id}</div>`;
    body.querySelector('#checklistBlock').style.display = 'block';
    req.status = 'in_progress';
    saveState();
    evaluateTolerance();
  });

  // Tolerance evaluation logic
  function evaluateTolerance(){
    const dec = parseFloat(body.querySelector('#declared').value);
    const meas = parseFloat(body.querySelector('#measured').value);
    const tol = parseFloat(body.querySelector('#tolerance').value);
    const unit = body.querySelector('#testUnit').value;
    const box = body.querySelector('#toleranceEvalBox');

    if (isNaN(dec) || isNaN(meas) || isNaN(tol) || dec <= 0 || meas <= 0 || tol <= 0) {
      box.innerHTML = `<div class="msg err">Please enter valid numerical values greater than 0 for standard value, measured value, and tolerance limit.</div>`;
      return { valid: false, isPass: false };
    }

    const diff = meas - dec;
    const absError = Math.abs(diff);
    const isPass = absError <= (tol + 1e-9);

    ctx.toleranceEval = { dec, meas, tol, unit, diff, absError, isPass };

    if (isPass) {
      box.innerHTML = `<div class="msg ok">
        <strong>${t('tol_pass')}</strong><br/>
        Declared: <strong>${dec.toFixed(3)} ${unit}</strong> | Measured: <strong>${meas.toFixed(3)} ${unit}</strong> | Error: <strong>${diff>=0?'+':''}${diff.toFixed(4)} ${unit}</strong> (|Δ| = ${absError.toFixed(4)} ${unit}) ≤ Permissible: <strong>±${tol.toFixed(4)} ${unit}</strong>
      </div>`;
    } else {
      const excess = (absError - tol).toFixed(4);
      box.innerHTML = `<div class="msg err">
        <strong>${t('tol_fail')}</strong><br/>
        Error: <strong>${diff>=0?'+':''}${diff.toFixed(4)} ${unit}</strong> (|Δ| = ${absError.toFixed(4)} ${unit}) EXCEEDS permissible tolerance limit of <strong>±${tol.toFixed(4)} ${unit}</strong> by <strong>${excess} ${unit}</strong>! Approval is blocked. You must reject this application or order recalibration.
      </div>`;
    }

    return { valid: true, isPass, dec, meas, tol, unit, diff, absError };
  }

  body.querySelector('#declared').addEventListener('input', evaluateTolerance);
  body.querySelector('#measured').addEventListener('input', evaluateTolerance);
  body.querySelector('#tolerance').addEventListener('input', evaluateTolerance);
  body.querySelector('#testUnit').addEventListener('change', evaluateTolerance);

  // OCR Serial Check
  function runOcrCheck(){
    const captured = body.querySelector('#ocrCaptured').value.trim();
    const resEl = body.querySelector('#ocrResult');
    if (!captured) { ctx.ocrResult = null; resEl.innerHTML = ''; return; }
    const result = matchSerial(req.details.serial, captured);
    ctx.ocrResult = { captured, ...result };
    if (result.status === 'MATCH') {
      resEl.innerHTML = `<div class="msg ok">${t('ocr_match_ok')}</div>`;
    } else if (result.status === 'REVIEW') {
      resEl.innerHTML = `<div class="msg" style="border-color:var(--ochre);color:var(--ochre);background:#FFF2E0;">
        ${t('ocr_review_warn')} (Distance: ${result.distance} char)
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:12px;margin-top:8px;color:#222;">
          <input type="checkbox" id="ocrOverride" style="width:auto;"/> I have visually inspected and confirm the physical serial plate matches
        </label>
      </div>`;
    } else {
      resEl.innerHTML = `<div class="msg err">${t('ocr_mismatch_err')} (Captured: "${captured}" vs Registered: "${req.details.serial}")</div>`;
    }
  }

  body.querySelector('#ocrCaptured').addEventListener('input', runOcrCheck);

  // OCR Camera Modal
  body.querySelector('#ocrOpenCam').addEventListener('click', () => {
    openOcrScannerModal(body, req, (capturedSerial) => {
      body.querySelector('#ocrCaptured').value = capturedSerial;
      runOcrCheck();
    });
  });

  // --- RISK AUDIT & FINE INTERACTION LOGIC ---
  const chkRiskLegit = body.querySelector('#chkRiskLegit');
  const btnToggleRiskFine = body.querySelector('#btnToggleRiskFine');
  const fineFormArea = body.querySelector('#fineFormArea');
  const btnConfirmRiskFine = body.querySelector('#btnConfirmRiskFine');
  const btnCancelRiskFine = body.querySelector('#btnCancelRiskFine');
  const activeFineStatus = body.querySelector('#activeFineStatus');
  const fineFindingReason = body.querySelector('#fineFindingReason');

  chkRiskLegit.addEventListener('change', () => {
    if (chkRiskLegit.checked) {
      ctx.riskAudit = {
        status: 'VERIFIED_LEGIT',
        officer: session.id,
        ts: nowISO(),
        declaredScore: risk.totalScore
      };
      fineFormArea.style.display = 'none';
      activeFineStatus.style.display = 'none';
      btnToggleRiskFine.style.display = 'inline-block';
    } else {
      ctx.riskAudit = null;
    }
  });

  btnToggleRiskFine.addEventListener('click', () => {
    chkRiskLegit.checked = false;
    fineFormArea.style.display = 'block';
    activeFineStatus.style.display = 'none';
  });

  btnCancelRiskFine.addEventListener('click', () => {
    fineFormArea.style.display = 'none';
    if (ctx.riskAudit?.status !== 'MISDECLARED_FINED') {
      ctx.riskAudit = null;
    }
  });

  btnConfirmRiskFine.addEventListener('click', () => {
    const reason = fineFindingReason.value.trim();
    if (!reason || reason.length < 5) {
      alert('Please state specific inspection findings for the misdeclaration.');
      return;
    }
    const noticeNo = 'FN-AHD-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random()*8999);
    ctx.riskAudit = {
      status: 'MISDECLARED_FINED',
      fineAmount: 5000,
      noticeNo,
      reason,
      officer: session.id,
      ts: nowISO(),
      declaredScore: risk.totalScore,
      paymentStatus: 'PENDING'
    };
    chkRiskLegit.checked = false;
    fineFormArea.style.display = 'none';
    activeFineStatus.style.display = 'block';
    activeFineStatus.innerHTML = `
      <strong>🚨 STATUTORY FINE OF ₹5,000 LEVIED ON APPLICANT</strong><br/>
      Notice No: <strong>${noticeNo}</strong> | Reason: <em>"${reason}"</em>.<br/>
      Penalty recorded under Section 53. You may now finalize certificate with compounding penalty or issue Rejection Order.
    `;
  });

  // Submit Verification & Issue Certificate
  body.querySelector('#submitVerify').addEventListener('click', async () => {
    const errSlot = body.querySelector('#verifyErrSlot');
    errSlot.innerHTML = '';

    const c1 = body.querySelector('#chk1').checked;
    const c2 = body.querySelector('#chk2').checked;
    const c3 = body.querySelector('#chk3').checked;
    if (!c1 || !c2 || !c3) {
      errSlot.innerHTML = `<div class="msg err">All physical inspection checklist items (Seal, Physical condition, Display) must be verified and checked to approve. If non-compliant, click "Reject Application".</div>`;
      return;
    }

    const tolRes = evaluateTolerance();
    if (!tolRes.valid) {
      errSlot.innerHTML = `<div class="msg err">Valid numerical testing weights are mandatory.</div>`;
      return;
    }
    if (!tolRes.isPass) {
      errSlot.innerHTML = `<div class="msg err">🚨 <strong>Approval Strictly Blocked</strong>: The measured error (${tolRes.absError.toFixed(4)} ${tolRes.unit}) exceeds legal tolerance (±${tolRes.tol.toFixed(4)} ${tolRes.unit}). You cannot approve this instrument. Issue a Rejection Order instead.</div>`;
      return;
    }

    const ocr = ctx.ocrResult;
    if (!ocr || !ocr.captured) {
      errSlot.innerHTML = `<div class="msg err">Please capture or verify the serial number plate before submitting.</div>`;
      return;
    }
    if (ocr.status === 'MISMATCH') {
      logHistory(req, `${session.role} ${session.id} flagged a serial mismatch — captured "${ocr.captured}" vs registered "${req.details.serial}"`);
      await saveState();
      errSlot.innerHTML = `<div class="msg err">🔴 Serial mismatch detected. Certificate cannot be generated for an unverified serial number. Issue a Rejection Order or report discrepancy.</div>`;
      return;
    }
    if (ocr.status === 'REVIEW' && !body.querySelector('#ocrOverride')?.checked) {
      errSlot.innerHTML = `<div class="msg err">Please confirm visual inspection checkbox for serial number review.</div>`;
      return;
    }

    // MANDATORY CHECK: Risk Score Legitimacy Audit
    if (!ctx.riskAudit || !ctx.riskAudit.status) {
      errSlot.innerHTML = `<div class="msg err"><strong>${t('err_risk_unverified')}</strong></div>`;
      body.querySelector('#riskAuditCard').scrollIntoView({ behavior: 'smooth' });
      return;
    }

    const certId = 'LM-AHD-' + new Date().getFullYear() + '-' + Math.floor(100000+Math.random()*899999);
    const evidenceHash = Array.from({length:16},()=> '0123456789ABCDEF'[Math.floor(Math.random()*16)]).join('');
    const cert = {
      id: certId,
      requestId: req.id,
      type: req.type,
      category: req.category,
      details: req.details,
      ownerId: req.ownerId,
      ownerName: req.ownerName,
      area: req.area,
      verifiedRole: session.role,
      verifiedId: session.id,
      verifiedDate: nowISO(),
      validUntil: addDays(new Date(), 365).toISOString(),
      gps: ctx.gps,
      evidenceHash,
      revoked: false,
      declared: `${tolRes.dec} ${tolRes.unit}`,
      measured: `${tolRes.meas} ${tolRes.unit}`,
      tolerance: `±${tolRes.tol} ${tolRes.unit}`,
      error: `${tolRes.diff>=0?'+':''}${tolRes.diff.toFixed(4)} ${tolRes.unit}`,
      ocrCheck: ctx.ocrResult,
      riskAudit: ctx.riskAudit
    };

    state.certificates[certId] = cert;
    req.status = 'completed';
    req.certificateId = certId;
    req.riskAudit = ctx.riskAudit;

    if (ctx.riskAudit.status === 'MISDECLARED_FINED') {
      req.fine = ctx.riskAudit;
      logHistory(req, `🚨 Statutory Fine of ₹5,000 levied on applicant by ${session.role} ${session.id} for false risk declaration (Notice #${ctx.riskAudit.noticeNo}).`);
    } else {
      logHistory(req, `${session.role} ${session.id} certified customer's declared risk score (${risk.totalScore} pts) as authentic and legitimate.`);
    }

    logHistory(req, `${session.role} ${session.id} completed verification — Certificate ${certId} issued (Error: ${cert.error} within ${cert.tolerance})`);
    await saveState();
    renderQrResult(body, cert, onDone);
  });

  // Rejection Button & Workflow
  body.querySelector('#rejectVerify').addEventListener('click', () => {
    const tolRes = evaluateTolerance();
    openRejectionModal(body, req, tolRes, onDone);
  });
}

// ---------- FORMAL REJECTION WORKFLOW ----------
function openRejectionModal(body, req, tolRes, onDone){
  const host = body.querySelector('#rejectionModalHost');

  let defaultReason = 'Measured Error Exceeds Maximum Permissible Error (MPE)';
  if (ctx.riskAudit?.status === 'MISDECLARED_FINED') defaultReason = 'Fraudulent / Misdeclared Operational Risk Assessment';
  else if (tolRes && !tolRes.isPass) defaultReason = 'Measured Error Exceeds Maximum Permissible Error (MPE)';
  else if (!body.querySelector('#chk1')?.checked) defaultReason = 'Verification Seal Broken, Missing or Tampered';
  else if (!body.querySelector('#chk2')?.checked) defaultReason = 'Physical Structure Damaged or Altered';
  else if (!body.querySelector('#chk3')?.checked) defaultReason = 'Display / Zero Indication Defective';
  else if (ctx.ocrResult?.status === 'MISMATCH') defaultReason = 'Serial Number Plate Mismatch / Tampered Marking';

  host.innerHTML = `
  <div class="scan-modal" id="rejModal">
    <div class="card" style="width:420px;max-width:92vw;background:#fff;border-top:4px solid var(--brick);box-shadow:0 10px 30px rgba(0,0,0,0.5);">
      <div style="font-weight:bold;font-size:14px;color:var(--brick);">${t('rej_modal_title')}</div>
      <div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">Request ID: <strong>${req.id}</strong> · ${req.type} (${req.ownerName})</div>
      <div class="divider"></div>
      <div class="field">
        <label>${t('rej_reason_lbl')}</label>
        <select id="rejReason">
          <option value="Fraudulent / Misdeclared Operational Risk Assessment"${defaultReason.includes('Risk')?' selected':''}>Fraudulent / Misdeclared Operational Risk Assessment (Section 53)</option>
          <option value="Measured Error Exceeds Maximum Permissible Error (MPE)"${defaultReason.includes('Error')?' selected':''}>Measured Error Exceeds Maximum Permissible Error (MPE Limit)</option>
          <option value="Verification Seal Broken, Missing or Tampered"${defaultReason.includes('Seal')?' selected':''}>Verification Seal Broken, Missing or Tampered</option>
          <option value="Physical Structure Damaged or Altered"${defaultReason.includes('Physical')?' selected':''}>Physical Structure Damaged or Altered</option>
          <option value="Display / Zero Indication Defective"${defaultReason.includes('Display')?' selected':''}>Display / Zeroing Mechanism Defective</option>
          <option value="Serial Number Plate Mismatch / Tampered Marking"${defaultReason.includes('Serial')?' selected':''}>Serial Number Plate Mismatch / Fraudulent Marking</option>
          <option value="Unapproved Make / Pattern Specifications">Unapproved Make / Pattern Specifications</option>
          <option value="Other Statutory Non-Compliance">Other Statutory Non-Compliance</option>
        </select>
      </div>
      <div class="field">
        <label>${t('rej_remarks_lbl')}</label>
        <textarea id="rejRemarks" rows="3" placeholder="Enter specific observations, error measurements, or defects found during inspection..."></textarea>
      </div>
      <div id="rejErrSlot"></div>
      <div style="background:#FFF0F0;border:1px solid var(--brick);padding:8px 10px;font-size:10.5px;color:var(--brick);margin-bottom:12px;">
        ⚠️ This will formally reject the application under the Legal Metrology Act, 2009. The applicant will be served a Statutory Rejection Order.
        ${ctx.riskAudit?.status === 'MISDECLARED_FINED' ? '<br/><strong>A penalty notice of ₹5,000 will be attached for false risk declaration.</strong>' : ''}
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn ghost" id="cancelRej" style="border:1px solid var(--line);">${t('rej_cancel_btn')}</button>
        <button class="btn brick" id="confirmRej">${t('rej_confirm_btn')}</button>
      </div>
    </div>
  </div>`;

  host.querySelector('#cancelRej').addEventListener('click', () => { host.innerHTML = ''; });
  host.querySelector('#confirmRej').addEventListener('click', async () => {
    const reason = host.querySelector('#rejReason').value;
    const remarks = host.querySelector('#rejRemarks').value.trim();
    if (!remarks || remarks.length < 5) {
      host.querySelector('#rejErrSlot').innerHTML = `<div class="msg err">Please provide detailed technical observations (at least 5 characters).</div>`;
      return;
    }

    const orderNo = 'REJ-ORD-' + new Date().getFullYear() + '-' + Math.floor(1000+Math.random()*8999);
    const rejectionData = {
      orderNo,
      reason,
      remarks,
      officerId: session.id,
      officerRole: session.role,
      ts: nowISO(),
      gps: ctx.gps || 'Recorded at site',
      standardVal: tolRes?.dec ? `${tolRes.dec} ${tolRes.unit}` : 'N/A',
      measuredVal: tolRes?.meas ? `${tolRes.meas} ${tolRes.unit}` : 'N/A',
      errorVal: tolRes?.diff ? `${tolRes.diff>=0?'+':''}${tolRes.diff.toFixed(4)} ${tolRes.unit}` : 'N/A',
      toleranceLimit: tolRes?.tol ? `±${tolRes.tol} ${tolRes.unit}` : 'N/A',
    };

    req.status = 'rejected';
    req.rejection = rejectionData;

    if (ctx.riskAudit?.status === 'MISDECLARED_FINED') {
      req.fine = ctx.riskAudit;
      logHistory(req, `Statutory Fine of ₹5,000 levied on applicant (Notice #${ctx.riskAudit.noticeNo})`);
    }

    logHistory(req, `Statutory Rejection Order issued by ${session.role} ${session.id} — Ground: ${reason} (Order #${orderNo})`);
    await saveState();

    host.innerHTML = '';
    renderRejectionOrderScreen(body, req, rejectionData, onDone);
  });
}

}

// ---------- CAMERA OCR MODAL ----------

  <div class="scan-modal" id="ocrScanModal">
    <div class="scan-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="color:#fff;font-size:11px;letter-spacing:0.05em;font-weight:bold;">📷 CAMERA OCR SCANNER</div>
        <span id="camStatusBadge" style="font-size:9.5px;color:#34C759;background:rgba(52,199,89,0.15);padding:1px 6px;border-radius:2px;">Optical Ready</span>
      </div>
      <div class="viewfinder" id="ocrVf">
        <video id="ocrCamVideo" autoplay playsinline style="width:100%;height:100%;object-fit:cover;display:none;position:absolute;inset:0;"></video>
        <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
        <div class="scanline"></div>
        <div class="ocr-target-frame"><span>[ SERIAL NO. PLATE ]</span></div>
      </div>
      <div style="color:#abb4ba;font-size:10px;margin-top:10px;">Align camera frame with the serial number plate on the machine.</div>
      
      <button class="btn moss" id="ocrCaptureBtn" style="margin-top:10px;width:100%;padding:9px;font-size:12px;">📸 Capture & Run OCR</button>
      
      <div style="display:flex;gap:4px;margin-top:8px;">
        <button class="btn ghost" id="simExact" style="flex:1;background:#222;color:#fff;font-size:9.5px;padding:4px;border:1px solid #444;" title="Simulate Exact Read">Exact</button>
        <button class="btn ghost" id="simNoise" style="flex:1;background:#222;color:#fff;font-size:9.5px;padding:4px;border:1px solid #444;" title="Simulate 1-char OCR noise">Noise</button>
        <button class="btn ghost" id="simMismatch" style="flex:1;background:#222;color:#fff;font-size:9.5px;padding:4px;border:1px solid #444;" title="Simulate Mismatched plate">Mismatch</button>
      </div>

      <button class="btn ghost" id="ocrCloseScan" style="margin-top:8px;width:100%;background:#fff;padding:6px;font-size:11px;">Cancel</button>
    </div>
  </div>`;

  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        activeStream = stream;
        const vid = host.querySelector('#ocrCamVideo');
        if (vid) {
          vid.srcObject = stream;
          vid.style.display = 'block';
        }
        const badge = host.querySelector('#camStatusBadge');
        if (badge) badge.innerText = 'Live Device Camera';
      })
      .catch(() => {
        const badge = host.querySelector('#camStatusBadge');
        if (badge) badge.innerText = 'Optical Sensor';
      });
  }

  function cleanup(){
    if (activeStream) {
      activeStream.getTracks().forEach(track => track.stop());
      activeStream = null;
    }
    host.innerHTML = '';
  }

  host.querySelector('#ocrCloseScan').addEventListener('click', cleanup);

  function executeCapture(simType){
    let captured;
    if (simType === 'exact') captured = regSerial;
    else if (simType === 'noise') captured = introduceOcrNoise(regSerial, 1);
    else if (simType === 'mismatch') captured = introduceOcrNoise(regSerial, 3);
    else {
      const roll = Math.random();
      if (roll < 0.65) captured = regSerial;
      else if (roll < 0.88) captured = introduceOcrNoise(regSerial, 1);
      else captured = introduceOcrNoise(regSerial, 3);
    }

    const vf = host.querySelector('#ocrVf');
    if (vf) {
      vf.style.transition = 'filter 0.1s ease';
      vf.style.filter = 'brightness(2.5)';
      setTimeout(() => {
        cleanup();
        onCaptured(captured);
      }, 200);
    } else {
      cleanup();
      onCaptured(captured);
    }
  }

  host.querySelector('#ocrCaptureBtn').addEventListener('click', () => executeCapture('auto'));
  host.querySelector('#simExact').addEventListener('click', () => executeCapture('exact'));
  host.querySelector('#simNoise').addEventListener('click', () => executeCapture('noise'));
  host.querySelector('#simMismatch').addEventListener('click', () => executeCapture('mismatch'));
}

// ---------- PUBLIC VIEW ----------
function renderPublic(root){
  ctx.tab = ctx.tab || 'search';
  root.innerHTML = govChrome() + `
  <div class="topbar">
    <div class="brand"><div class="emblem"></div><div class="brand-mark">M</div><div>
      <div style="font-weight:bold;font-size:16px;color:var(--ink);">MEIRA</div>
      <div style="font-size:9.5px;color:var(--ink-soft);">${t('brand_sub')}</div>
    </div></div>
    <button class="btn ghost" id="backLogin">← ${t('signin')}</button>
  </div>
  <div class="container" style="max-width:560px;">
    <h2 style="font-size:17px;margin-bottom:6px;">${t('pub_verify_title')}</h2>
    <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:14px;">${t('pub_verify_sub')}</div>
    <div class="card" style="text-align:center;margin-bottom:16px;">
      <button class="btn moss" id="openScanner" style="padding:10px 22px;">${t('pub_scan_btn')}</button>
      <div style="font-size:10px;color:var(--ink-soft);margin-top:8px;">Uses your device camera to scan the certificate QR</div>
    </div>
    <div class="row"><div class="field" style="flex:2;"><input id="p_search" placeholder="e.g. LM-AHD-2026-928371"/></div>
    <div class="field" style="flex:0 0 auto;"><button class="btn" id="p_go">${t('pub_check_btn')}</button></div></div>
    <div id="p_result"></div>
  </div>
  <div id="scannerHost"></div>`;

  wireGlobalEvents(root);
  root.querySelector('#backLogin').addEventListener('click', () => { session=null; view='login'; ctx={}; render(); });
  root.querySelector('#openScanner').addEventListener('click', () => openScannerModal(root));
  root.querySelector('#p_go').addEventListener('click', () => {
    let q = root.querySelector('#p_search').value.trim();
    q = q.replace('MEIRA-CERT:','').trim();
    const c = state.certificates[q];
    const resEl = root.querySelector('#p_result');
    if (!c) { resEl.innerHTML = `<div class="msg err" style="margin-top:14px;">🔴 INVALID / NOT FOUND — No active or historical certificate found with ID "${q}". Please verify with Legal Metrology authorities.</div>`; return; }
    const status = computeStatus(c);
    const statusIcon = status==='VALID' ? '🟢' : status==='EXPIRED' ? '🟠' : '🔴';
    resEl.innerHTML = `<div class="card" style="margin-top:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-family: Verdana, Arial, sans-serif;font-weight:700;">${statusIcon} ${status}</div>
        ${badgeForCert(status)}
      </div>
      <div class="divider"></div>
      <div class="kv">
        <div>Instrument</div><div>${c.type}</div>
        <div>Business / Trader</div><div>${c.ownerName}</div>
        <div>Manufacturer</div><div>${c.details.manufacturer||'—'}</div>
        <div>Serial No.</div><div>${c.details.serial||'—'}</div>
        <div>Verified On</div><div>${fmtDate(c.verifiedDate)}</div>
        <div>Valid Until</div><div>${fmtDate(c.validUntil)}</div>
        <div>Verified By</div><div>${c.verifiedRole} ${c.verifiedId}</div>
        <div>Location / Region</div><div>${c.area}</div>
        <div>Certificate ID</div><div>${c.id}</div>
        <div>Digital Evidence</div><div>✓ Validated (Hash: <code>${c.evidenceHash}</code>)</div>
      </div>
      <div style="margin-top:12px;"><button class="btn brick" id="reportBtn">${t('pub_report_btn')}</button></div>
      <div id="reportForm"></div>
    </div>`;

    resEl.querySelector('#reportBtn').addEventListener('click', () => {
      resEl.querySelector('#reportForm').innerHTML = `<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px;">
        <div class="field"><label>Issue Type</label><select id="rep_type"><option>Incorrect / Under-measurement</option><option>Damaged / Broken seal</option><option>Suspicious certificate</option><option>Certificate not displayed</option><option>Other</option></select></div>
        <div class="field"><label>Description</label><textarea id="rep_desc" rows="3" placeholder="Provide details of transaction or discrepancy..."></textarea></div>
        <button class="btn" id="rep_submit">Submit Grievance</button>
        <div id="rep_out"></div>
      </div>`;
      resEl.querySelector('#rep_submit').addEventListener('click', () => {
        const cid = 'CMP-' + new Date().getFullYear() + '-' + Math.floor(1000+Math.random()*8999);
        resEl.querySelector('#rep_out').innerHTML = `<div class="msg ok" style="margin-top:8px;">Grievance registered — Complaint ID <strong>${cid}</strong>. Recorded in intelligence risk analytics.</div>`;
      });
    });
  });
}

function openScannerModal(root){
  const host = root.querySelector('#scannerHost');
  const demoCerts = Object.keys(state.certificates).filter(id => !state.certificates[id].synthetic);
  const fallbackCert = demoCerts[0] || Object.keys(state.certificates)[0];

  host.innerHTML = `
  <div class="scan-modal" id="scanModal">
    <div class="scan-box">
      <div style="color:#fff;font-size:11px;letter-spacing:0.05em;margin-bottom:10px;font-weight:bold;">CAMERA QR SCANNER</div>
      <div class="viewfinder">
        <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
        <div class="scanline"></div>
      </div>
      <div style="color:#aab;font-size:10px;margin-top:12px;">Point your camera at a MEIRA certificate QR label.</div>
      ${fallbackCert ? `<button class="btn moss" id="simScan" style="margin-top:12px;width:100%;">Simulate Scan — ${fallbackCert}</button>` : ''}
      <button class="btn ghost" id="closeScan" style="margin-top:8px;width:100%;background:#fff;">Cancel</button>
    </div>
  </div>`;
  host.querySelector('#closeScan').addEventListener('click', () => { host.innerHTML = ''; });
  const sim = host.querySelector('#simScan');
  if (sim) sim.addEventListener('click', () => {
    root.querySelector('#p_search').value = fallbackCert;
    host.innerHTML = '';
    root.querySelector('#p_go').click();
  });
}

// ---------- ROUTER ----------
async function render(){
  const root = document.getElementById('meira-root');
  if (!state) state = await loadState();
  if (!session) { renderLogin(root); return; }
  if (session.role === 'PUBLIC') { renderPublic(root); return; }
  if (session.role === 'ADMIN') { renderAdmin(root); }
  else if (session.role === 'OWNER') { renderOwner(root); }
  else if (session.role === 'LMO') { renderField(root, 'LMO'); }
  else if (session.role === 'GATC') { renderField(root, 'GATC'); }
}

(async () => { await render(); })();
})();
</script>
